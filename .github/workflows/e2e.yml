name: E2E

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          extra-packages: mesa-utils vim

      # The e2e suites drive real toolchains; each one skips when its
      # binary is absent, so a missing tool degrades coverage rather
      # than failing the run.
      - name: Install language toolchains
        run: |
          go install golang.org/x/tools/gopls@latest
          go install github.com/go-delve/delve/cmd/dlv@latest
          rustup component add rust-analyzer || true
          curl -LsSf https://astral.sh/uv/install.sh | sh

      # The GUI e2e suites open real windows through ebiten/glfw,
      # which needs an X display; the hosted runners are headless.
      - name: Run e2e suite (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" make test-e2e

      - name: Run e2e suite
        if: runner.os != 'Linux'
        run: make test-e2e
