# Rune user configuration (standard editor preset).
editor:
  mode: standard
  auto_pair: true
  standard:
    attr: {fg: default, bg: default}
    search_attr: {fg: grey, bg: yellow}
terminal:
  modal: false
command:
  key: <c-s-p>
  history_key: <c-r>
  key_bindings:
    "<c-s>": write
    "<c-s-s>": writeall
    "<c-o>": searchfile
    "<c-,>": config
    "<c-n>": tabnew
    "<c-f4>": tabclose
    "<c-f>": "echo <m-f>"
    "<c-s-f>": searchtext
    "<m-f2>": "locationtoggle bookmark"
    "<f2>": "jumptolocation next bookmark"
    "<s-f2>": "jumptolocation previous bookmark"
    "<a-f2>": "locationhighlight bookmark"
    "<s-m-f2>": "locationdeleteall bookmark"
    "<f3>": "jumptolocation next search"
    "<s-f3>": "jumptolocation prev search"
    "<a-c>": "lsp declaration"
    "<a-y>": "lsp type-definition"
    "<a-s-y>": "echo {prompt}lsp<space>type-definition<space>"
    "<a-s-c>": "echo {prompt}lsp<space>declaration<space>"
    "<a-g>": "lsp signature-help"
    "<m-r>": ""
    "<m-q>": ""
    "<m-t>": ""
    "<m-n>": ""
    "<m-c>": ""
    "<m-v>": ""
    "<m-w>": ""
    "<m-f>": ""
    "<s-m-f>": ""
    "<ctrl-shift-->": "cursorhistory next"
    "<ctrl-->": "cursorhistory prev"
    "<c-g>": "echo <esc>:"
    "<ctrl-meta-p>": "echo <esc>:workspacefocus<space>"
    # IJKL points up, left, down, right. <alt> focuses a window;
    # add <shift> to move it and <meta> to resize it.
    "<a-i>": "windowfocus up"
    "<a-j>": "windowfocus left"
    "<a-k>": "windowfocus down"
    "<a-l>": "windowfocus right"
    "<a-s-i>": "windowmove up"
    "<a-s-j>": "windowmove left"
    "<a-s-k>": "windowmove down"
    "<a-s-l>": "windowmove right"
    "<alt-meta-i>": "windowresize increase height"
    "<alt-meta-j>": "windowresize decrease width"
    "<alt-meta-k>": "windowresize decrease height"
    "<alt-meta-l>": "windowresize increase width"
    # The modified arrows remain available as resize aliases.
    "<c-a-m-left>": "windowresize decrease width"
    "<c-a-m-right>": "windowresize increase width"
    "<c-a-m-down>": "windowresize decrease height"
    "<c-a-m-up>": "windowresize increase height"
    # Create and close windows and tabs on the same <alt> layer.
    "<a-n>": windownew
    "<alt-enter>": terminalneworsplit
    "<a-q>": windowclose
    "<a-m>": windowtogglemaximize
    "<a-s-enter>": "echo {prompt}windowconverttab<space>"
    "<a-t>": tabnew
    "<a-w>": tabclose
    # Brackets switch tabs; add <shift> to reorder them.
    "<a-[>": tabprevious
    "<a-]>": tabnext
    "<a-s-[>": "tabmove left"
    "<a-s-]>": "tabmove right"
    "<a-s-h>": ""
    "<a-h>": "windowdefaultsplit h"
    "<a-v>": "windowdefaultsplit v"
    "<c-m-h>": ""
    "<c-m-v>": ""
    # Ctrl-Meta I/K visits Git changes; J/L visits diagnostics.
    "<c-m-i>": gitprevchange
    "<c-m-k>": gitnextchange
    "<c-m-j>": lspprevdiagnostic
    "<c-m-l>": lspnextdiagnostic
    "<a-s-t>": ""
    "<c-a-h>": "lsp hover"
    "<c-s-a-h>": "echo {prompt}lsp<space>hover<space>"
    "<c-a-i>": "lsp implementation"
    "<c-s-a-i>": "echo {prompt}lsp<space>implementation<space>"
    "<c-a-v>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.var<space>"
    "<c-i>": ""
    "<c-k>": ""
    "<s-m-r>": history
    "<c-a-m-i>": ""
    "<c-a-m-j>": ""
    "<c-a-m-k>": ""
    "<c-a-m-l>": ""
    "<c-a-j>": ""
    "<c-a-l>": ""
    "<c-s-a-j>": ""
    "<c-s-a-l>": ""
    "<c-s-m-i>": ""
    "<c-s-m-j>": ""
    "<c-s-m-k>": ""
    "<c-s-m-l>": ""
    "<m-left>": ""
    "<m-right>": ""
    "<m-down>": ""
    "<m-up>": ""
    "<s-m-left>": ""
    "<s-m-right>": ""
    "<s-m-down>": ""
    "<s-m-up>": ""
    "<alt-meta-h>": ""
    "<a-s-left>": ""
    "<a-s-right>": ""
    "<m-h>": ""
    "<m-j>": ""
    "<m-k>": ""
    "<m-l>": ""
    "<s-m-h>": ""
    "<s-m-j>": ""
    "<s-m-k>": ""
    "<s-m-l>": ""

# log_level: info               # debug | info | warn | error
# log_path: ~/.rune/debug.log

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live and `:colorPalette` to see named colors.
# Try `mullen` for a deep-purple / hot-pink feel, or `kernighan` for the
# classic Windows-Terminal palette.
# ---------------------------------------------------------------------------
# gui:
#   default_theme: romero
#   font_size: 13
#   line_height_offset: 0
#   column_width_offset: -1
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor behavior
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open

# ---------------------------------------------------------------------------
# Auxiliary bar (left of each editor pane)
# ---------------------------------------------------------------------------
# editor:
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true

# ---------------------------------------------------------------------------
# Editor status bar (bottom)
# ---------------------------------------------------------------------------
# editor:
#   status_bar:
#     enabled: true
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   max_lines:         1000
#   initial_reservoir: 0           # pre-spawned emulator instances
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_align_bottom:    false
#     status_error_icon:   ""
#     status_success_icon: ""

# ---------------------------------------------------------------------------
# Animations between workspaces
# ---------------------------------------------------------------------------
# animations:
#   loading_workspace: true
#   open_workspace:
#     enabled:  true
#     # shader:   burn
#     # duration: 1s

# ---------------------------------------------------------------------------
# Self-upgrade
# ---------------------------------------------------------------------------
# upgrade:
#   auto_check_enabled: true
#   check_period:       24h

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# notifications:
#   auto_close:   5s
#   padding:      1
#   progress_bar: true

# ---------------------------------------------------------------------------
# Command prompt — additions to the active standard overrides above
#
# The active block has already remapped `command.key` to <c-s-p>; you
# can replace that here. Aliases layer on top of built-ins: a string
# value is the substitution, a dict with `command` + `completer` adds
# completion. Set a key_binding value to "" to unbind a built-in.
# ---------------------------------------------------------------------------
# command:
#   history_key: <c-r>
#   max_history: 20000
#   aliases:
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     conf: config
