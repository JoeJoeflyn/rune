# Rune user configuration.
#
# Every property below is commented out except `log_level`, which keeps
# this file syntactically non-empty. Uncomment what you want to change.
# The shown values are Rune's built-in defaults; see the embedded
# rune.star (bundled with the binary) for the full schema and run
# `:config` from inside Rune to open this file again.

log_level: info               # debug | info | warn | error
# log_path: ~/.rune/debug.log

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes. Set `default_theme` to any of:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live and `:colorPalette` to see named colors.
# Try `mullen` for a deep-purple / hot-pink feel, or `kernighan` for the
# classic Windows-Terminal palette.
# ---------------------------------------------------------------------------
# gui:
#   default_theme: romero
#   font_size: 13
#   line_height_offset: 0
#   column_width_offset: -1
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor behavior
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_pair: false            # auto-pair quotes/brackets/braces (modal default)
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open

# ---------------------------------------------------------------------------
# Editor status bar (bottom)
#
# `layout` is a Go text/template string. Available components include
# Status, Filepath, GitShortRef, GitDiffAdd, GitDiffDel, ShiftRight,
# CursorColumn, CursorLine, TotalLines, Language. Pipe operators: bg,
# fg, bold, italic, underline, reverse, dim.
# ---------------------------------------------------------------------------
# editor:
#   status_bar:
#     enabled: true
#     layout: ' {{ .Status | bg "red" | fg "white" | bold }} █▓▒░  {{ .Filepath | fg "white" }}  {{ .GitShortRef | fg "white" }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn | fg "white" }}:{{ .CursorLine | fg "white" }}  {{ .TotalLines | fg "white" }} lines  ░▒▓█ {{ .Language | bold | fg "white" | bg "red" }} '
#     background_attr:        {bg: gray}
#     foreground_error_attr:  {fg: yellow}

# ---------------------------------------------------------------------------
# Editor message bar (search prompts and echoed messages)
#
# `attr` sets the base attributes of the message bar and the search prompt.
# `layout` is a Go text/template string with a single Message component and
# the same pipe operators as the status bar; its styling wins over `attr`.
# ---------------------------------------------------------------------------
# editor:
#   modal:
#     message_bar:
#       attr: {fg: default, bg: gray}
#       layout: '░▒▓█ {{ .Message | fg "white" }} '

# ---------------------------------------------------------------------------
# Auxiliary bar (left of each editor pane: line numbers, git, folds, icons)
# ---------------------------------------------------------------------------
# editor:
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   modal:             true        # enter modal terminal mode on <esc>
#   max_lines:         1000
#   initial_reservoir: 0           # pre-spawned emulator instances
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_align_bottom:    false
#     status_error_icon:   ""
#     status_success_icon: ""

# ---------------------------------------------------------------------------
# Animations between workspaces
# ---------------------------------------------------------------------------
# animations:
#   loading_workspace: true
#   open_workspace:
#     enabled:  true
#     # shader:   burn
#     # duration: 1s

# ---------------------------------------------------------------------------
# Self-upgrade
# ---------------------------------------------------------------------------
# upgrade:
#   auto_check_enabled: true
#   check_period:       24h

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# notifications:
#   auto_close:   5s
#   padding:      1
#   progress_bar: true

# ---------------------------------------------------------------------------
# Command prompt
#
# `key` opens the command prompt; `history_key` toggles between command
# list and history. Aliases layer on top of built-ins: a string value is
# the substitution, a dict with `command` + `completer` adds completion.
# Set a key_binding value to "" to unbind a built-in.
# ---------------------------------------------------------------------------
# command:
#   key:         ":"
#   history_key: <m-r>
#   max_history: 20000
#   aliases:
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     # The `! …` template runs a shell line whose stdout becomes one
#     # completion candidate per line.
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     # Open this configuration file (already bound to <m-,>).
#     conf: config
#   key_bindings:
#     "<m-,>":     config
#     "<m-q>":     quit
#     "<m-p>":     searchfile
#     "<m-\\\\>":  searchtext
#     "<m-enter>": terminalneworsplit
#     "<a-j>":     lspnextdiagnostic
#     "<a-k>":     lspprevdiagnostic
