# Rune user configuration (emacs editor preset).
editor:
  mode: emacs
  auto_pair: true
  standard:
    attr: {fg: default, bg: default}
    search_attr: {fg: grey, bg: yellow}
terminal:
  modal: false
command:
  key: <a-x>                       # execute-extended-command (M-x)
  key_bindings:
    # Files and sessions use familiar Emacs C-x chords.
    "<c-x><c-s>": write            # save-buffer
    "<c-x>s": writeall             # save-some-buffers
    "<c-x><c-c>": quit             # exit when no buffers have pending changes
    "<c-x><c-f>": searchfile       # find-file
    # P/N/B/F follows Emacs's previous, next, backward, and forward directions.
    "<m-p>": "windowfocus up"
    "<m-b>": "windowfocus left"
    "<m-n>": "windowfocus down"
    "<m-f>": "windowfocus right"
    "<s-m-p>": "windowmove up"
    "<s-m-b>": "windowmove left"
    "<s-m-n>": "windowmove down"
    "<s-m-f>": "windowmove right"
    "<m-d>": "windownew down"
    "<m-r>": "windownew right"
    "<s-m-r>": history
    "<m-k>": windowcloseall
    "<m-e>": windowtogglemaximize
    "<c-m-i>": ""
    "<c-m-j>": ""
    "<c-m-k>": ""
    "<c-m-l>": ""
    "<c-s-m-i>": ""
    "<c-s-m-j>": ""
    "<c-s-m-k>": ""
    "<c-s-m-l>": ""
    "<m-h>": ""
    "<m-j>": "cursorhistory jump"
    "<m-l>": ""
    "<m-i>": "lsp implementation"
    "<m-g>": "jumptolocation next search"
    "<s-m-g>": "jumptolocation prev search"
    "<s-m-h>": "echo {prompt}lsp<space>hover<space>"
    "<s-m-j>": ""
    "<s-m-k>": ""
    "<s-m-l>": ""
    "<s-m-i>": "echo {prompt}lsp<space>implementation<space>"
    # Host-Meta arrows resize without consuming Emacs editing letters.
    "<c-a-m-i>": ""
    "<c-a-m-j>": ""
    "<c-a-m-k>": ""
    "<c-a-m-l>": ""
    "<c-a-m-up>": ""
    "<c-a-m-left>": ""
    "<c-a-m-down>": ""
    "<c-a-m-right>": ""
    "<m-up>": "windowresize increase height"
    "<m-left>": "windowresize decrease width"
    "<m-down>": "windowresize decrease height"
    "<m-right>": "windowresize increase width"
    "<s-m-up>": ""
    "<s-m-left>": ""
    "<s-m-down>": ""
    "<s-m-right>": ""
    "<alt-meta-h>": ""
    "<alt-meta-j>": ""
    "<alt-meta-k>": ""
    "<alt-meta-l>": ""
    # Tabs use <meta-[> / <meta-]> so <alt> stays available as Emacs Meta.
    "<m-]>": tabnext
    "<m-[>": tabprevious
    "<c-tab>": tabnext
    "<c-s-tab>": tabprevious
    "<m-w>": tabclose
    "<s-m-w>": windowclose
    "<s-m-]>": "tabmove right"
    "<s-m-[>": "tabmove left"
    # M-, / C-M-, follows GNU xref history; C-x C-x exchanges point and mark.
    "<a-,>": "cursorhistory prev"
    "<c-a-,>": "cursorhistory next"
    "<c-x><c-x>": exchangepointandmark
    # GNU xref, Dired, switch-buffer, symbol-jump, and completion semantics guide these keys.
    "<a-.>": "lsp definition"
    "<a-s-/>": "lsp references"
    "<c-a-.>": "echo {prompt}lsp<space>definition<space>"
    "<c-s-a-/>": "echo {prompt}lsp<space>references<space>"
    "<c-x>d": fexplorer
    "<c-x>b": tabsearch
    "<c-x>j": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    "<a-s>o": searchtext
    "<c-x>?": "lsp hover"
    "<c-a-\\\\>": "lsp format"
    "<c-a-i>": "lsp complete"
    # Reserve GNU C-x page, narrowing, project, register, tab, and macro keys.
    "<c-x>[": ""
    "<c-x>]": ""
    "<c-x>g": ""
    "<c-x>n": ""
    "<c-x>p": ""
    "<c-x>r": ""
    "<c-x>i": ""
    "<c-x>t": ""
    "<c-x>e": ""
    "<c-x>/": ""
    # F5/F6 visits Git changes; F7/F8 steps diagnostics; F9 opens their picker.
    "<f5>": gitprevchange
    "<f6>": gitnextchange
    "<f7>": lspprevdiagnostic
    "<f8>": lspnextdiagnostic
    "<f9>": "lsp diagnostics"
    # Ctrl-F2 visits bookmarks without replacing GNU Emacs's F2 command.
    "<m-f2>": "locationtoggle bookmark"
    "<f2>": ""
    "<c-f2>": "jumptolocation next bookmark"
    "<c-s-f2>": "jumptolocation previous bookmark"
    "<a-f2>": "locationhighlight bookmark"
    "<s-m-f2>": "locationdeleteall bookmark"
    # <alt> remains Emacs Meta for editing commands such as M-f, M-b, M-d and M-w.
    "<a-w>": ""
    "<a-l>": ""
    "<a-h>": ""
    "<a-`>": ""
    "<a-f>": ""
    "<a-v>": ""
    "<a-s>": ""
    "<a-d>": ""
    "<a-r>": ""
    "<a-i>": ""
    "<a-t>": ""
    "<a-b>": ""
    "<a-j>": ""
    "<a-k>": ""
    "<a-s-l>": ""
    "<a-s-h>": ""
    "<a-s-t>": ""
    "<a-s-e>": ""
    "<a-s-r>": ""
    "<a-s-d>": ""
    "<a-s-i>": ""
    "<a-s-j>": ""
    "<a-s-k>": ""
    "<a-1>": ""
    "<a-2>": ""
    "<a-3>": ""
    "<a-4>": ""
    "<a-5>": ""
    "<a-6>": ""
    "<a-7>": ""
    "<a-8>": ""
    "<a-9>": ""
    "<a-s-1>": ""
    "<a-s-2>": ""
    "<a-s-3>": ""
    "<a-s-4>": ""
    "<a-s-5>": ""
    "<a-s-6>": ""
    "<a-s-7>": ""
    "<a-s-8>": ""
    "<a-s-9>": ""
    "<alt-enter>": ""
    # C-SPC sets the mark; C-o opens a line; C-i and Shift-Tab indent.
    "<c-space>": ""
    "<c-o>": ""
    "<c-i>": ""
    "<shift-tab>": ""

# log_level: info               # debug | info | warn | error
# log_path: ~/.rune/debug.log

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live and `:colorPalette` to see named colors.
# Try `mullen` for a deep-purple / hot-pink feel, or `kernighan` for the
# classic Windows-Terminal palette.
# ---------------------------------------------------------------------------
# gui:
#   default_theme: romero
#   font_size: 13
#   line_height_offset: 0
#   column_width_offset: -1
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor behavior
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open

# ---------------------------------------------------------------------------
# Auxiliary bar (left of each editor pane)
# ---------------------------------------------------------------------------
# editor:
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true

# ---------------------------------------------------------------------------
# Editor status bar (bottom)
# ---------------------------------------------------------------------------
# editor:
#   status_bar:
#     enabled: true
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}

# ---------------------------------------------------------------------------
# Editor message bar (echo area: search prompts and echoed messages)
#
# `attr` sets the base attributes of the bar and of the transient mode label
# (ISEARCH, QUERY, ...) shown in the status bar. `layout` is a Go
# text/template string with a single Message component and the same pipe
# operators as the status bar; its styling wins over `attr`.
# ---------------------------------------------------------------------------
# editor:
#   emacs:
#     message_bar:
#       attr: {fg: default, bg: gray}
#       layout: '░▒▓█ {{ .Message | fg "white" }} '

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   max_lines:         1000
#   initial_reservoir: 0           # pre-spawned emulator instances
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_align_bottom:    false
#     status_error_icon:   ""
#     status_success_icon: ""

# ---------------------------------------------------------------------------
# Animations between workspaces
# ---------------------------------------------------------------------------
# animations:
#   loading_workspace: true
#   open_workspace:
#     enabled:  true
#     # shader:   burn
#     # duration: 1s

# ---------------------------------------------------------------------------
# Self-upgrade
# ---------------------------------------------------------------------------
# upgrade:
#   auto_check_enabled: true
#   check_period:       24h

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# notifications:
#   auto_close:   5s
#   padding:      1
#   progress_bar: true

# ---------------------------------------------------------------------------
# Command prompt — additions to the active emacs overrides above
#
# The active block has already remapped `command.key` to <a-x>; you
# can replace that here. Aliases layer on top of built-ins: a string
# value is the substitution, a dict with `command` + `completer` adds
# completion. Set a key_binding value to "" to unbind a built-in.
# ---------------------------------------------------------------------------
# command:
#   history_key: <m-r>
#   max_history: 20000
#   aliases:
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     conf: config
